name: tests
on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"   # woechentlich: faengt Brueche durch neue Abhaengigkeiten und API-Aenderungen
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp: ["mcp[cli]>=1.30,<2", "mcp[cli]>=2,<3"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python 3.12 --with pytest --with pytest-asyncio --with "${{ matrix.mcp }}" --with httpx --with duckdb --with python-calamine pytest -p no:cacheprovider -q
      - run: uv run --locked --script datagvat_mcp.py --selftest
  live:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python 3.12 --with pytest --with pytest-asyncio --with "mcp[cli]>=1.30,<3" --with httpx --with duckdb --with python-calamine pytest -p no:cacheprovider -q -m live
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t datagvat-mcp .
      - name: Rauchtest des Images, schreibgeschuetzt mit Volume fuer /tmp (wie deploy/exoscale)
        run: bash deploy/smoke-test.sh datagvat-mcp
      - name: Rauchtest des Images, schreibgeschuetzt mit tmpfs fuer /tmp (wie deploy/librechat)
        run: TMP_ART=tmpfs bash deploy/smoke-test.sh datagvat-mcp
      - name: Compose-Dateien und Caddyfile pruefen
        run: |
          MCP_AUTH_TOKEN=0123456789abcdef0123 MCP_DOMAIN=mcp.example.org docker compose -f deploy/exoscale/compose.yml config -q
          docker run --rm -e MCP_DOMAIN=mcp.example.org -v "$PWD/deploy/exoscale/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - name: LibreChat-Installer (Dateien, Wiederholung, Rueckbau)
        run: bash deploy/librechat/test-install.sh
